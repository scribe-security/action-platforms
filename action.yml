name: Scribe Platforms CLI Action
description: Scan, collect and verifies evidence from Supply chain platforms.
author: Mikey Strauss
inputs:
  command:
    description: Command to run
    required: true
  valint_args:
    description: Valint args
  sign:
    description: Sign evidence
  platform:
    description: Select Platform
    required: true
  args:
    description: "Additional arguments to pass to Platforms"
  log-level:
    description: Log verbosity level {DEBUG,INFO,WARNING,ERROR,CRITICAL}
  log-file:
    description: Log file path
  config:
    description: Path to a configuration file
  print-config:
    description: Print the configuration after applying all other arguments and exit
  db-local-path:
    description: Local db path
  skip-evidence:
    description: Skip Export evidence
  hook-config:
    description: Path to a hook configuration file
  hook:
    description: Select hook to run
runs:
  using: docker
  image: docker://scribesecurity/platforms:SH-7615-3rd-party-tools
  env:
    AUTO_FIX_ARGS: true
  args:
    - ${{ inputs.log-level && '--log-level=' }}${{ inputs.log-level}}
    - ${{ inputs.command }}
    - ${{ inputs.valint_args }}
    - ${{ inputs.sign && '--valint.sign' }}
    - ${{ inputs.skip-evidence == 'true' && '--skip-evidence' || '' }}
    - ${{ inputs.command != 'discover' && '--valint.context-type=github' || '' }}
    - ${{ inputs.platform }}
    - ${{ inputs.args }} 
    - ${{ inputs.hook-config && '--hook-config=' }}${{ inputs.hook-config }}
    - ${{ inputs.hook && '--hook=' }}${{ inputs.hook }}


branding:
  icon: shield
  color: green
